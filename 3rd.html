<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的三周年 ❤</title>
<style>

:root{
  --pink:#ff6b9d; --deep:#c9184a; --soft:#ffe5ec; --cream:#fff9f7;
  --gold:#e8b04b; --ink:#5c374c;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  background:linear-gradient(180deg,#fff0f3 0%,#ffe5ec 45%,#fff9f7 100%);
  color:var(--ink); min-height:100vh;
}
/* 背景漂浮爱心 */
.heart-bg{position:fixed;font-size:18px;opacity:.18;pointer-events:none;z-index:0;
  animation:floatUp linear infinite;}
@keyframes floatUp{
  0%{transform:translateY(105vh) rotate(0deg);}
  100%{transform:translateY(-10vh) rotate(360deg);}
}
header{
  text-align:center;padding:70px 20px 40px;position:relative;z-index:1;
}
header h1{
  font-size:2.6rem;color:var(--deep);letter-spacing:.12em;
  text-shadow:0 2px 12px rgba(255,107,157,.35);
}
header .sub{margin-top:14px;color:#a86b85;font-size:1.05rem;letter-spacing:.2em;}
.heart-beat{display:inline-block;color:var(--pink);animation:beat 1.2s ease-in-out infinite;}
@keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.25)}50%{transform:scale(1)}75%{transform:scale(1.18)}}
.days-tag{
  display:inline-block;margin-top:18px;padding:8px 26px;border-radius:999px;
  background:rgba(255,255,255,.7);border:1px solid #ffc2d4;color:var(--deep);
  font-size:.95rem;box-shadow:0 4px 14px rgba(255,107,157,.15);
}
.toolbar{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0 30px;position:relative;z-index:1;
}
.btn{
  border:none;cursor:pointer;padding:12px 26px;border-radius:999px;font-size:.95rem;
  transition:transform .15s,box-shadow .15s;letter-spacing:.05em;
}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:linear-gradient(135deg,#ff8fab,#ff6b9d);color:#fff;box-shadow:0 6px 18px rgba(255,107,157,.4);}
.btn-ghost{background:rgba(255,255,255,.85);color:var(--deep);border:1.5px solid #ffb3c6;}
#timeline{max-width:860px;margin:0 auto;padding:0 20px 120px;position:relative;z-index:1;}
/* 中轴线 */
#timeline::before{
  content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#ffb3c6,#ff6b9d,#ffb3c6);border-radius:3px;
  transform:translateX(-50%);opacity:.6;
}
.entry{position:relative;margin:56px 0;}
.entry .dot{
  position:absolute;left:50%;top:26px;transform:translateX(-50%);
  width:18px;height:18px;border-radius:50%;background:#fff;
  border:4px solid var(--pink);box-shadow:0 0 0 6px rgba(255,107,157,.18);z-index:2;
}
.entry .card{
  background:rgba(255,255,255,.92);border-radius:22px;padding:24px 26px;
  box-shadow:0 10px 30px rgba(201,24,74,.12);border:1px solid #ffe0e9;
  width:calc(50% - 44px);position:relative;backdrop-filter:blur(4px);
}
.entry:nth-child(odd) .card{margin-left:auto;}
.entry:nth-child(even) .card{margin-right:auto;}
.entry .date{
  display:inline-block;font-size:.8rem;color:#fff;background:linear-gradient(135deg,#ff8fab,#ff6b9d);
  padding:3px 14px;border-radius:999px;margin-bottom:10px;letter-spacing:.05em;
}
.entry h3{color:var(--deep);font-size:1.25rem;margin-bottom:8px;}
.entry .desc{color:#8a5a70;font-size:.95rem;line-height:1.75;white-space:pre-wrap;}
/* 拼图网格 */
.collage{display:grid;gap:8px;margin-top:16px;border-radius:16px;overflow:hidden;}
.collage.c1{grid-template-columns:1fr;}
.collage.c2{grid-template-columns:1fr 1fr;}
.collage.c3{grid-template-columns:1fr 1fr;}
.collage.c3 .ph:first-child{grid-row:span 2;}
.collage.c4{grid-template-columns:1fr 1fr;}
.collage.c5,.collage.c6{grid-template-columns:repeat(3,1fr);}
.collage.c5 .ph:first-child,.collage.c6 .ph:nth-child(-n+2){grid-row:span 2;}
.collage.c-many{grid-template-columns:repeat(3,1fr);}
.ph{position:relative;overflow:hidden;border-radius:10px;aspect-ratio:1;background:#fff0f3;}
.ph:first-child{aspect-ratio:auto;}
.collage.c1 .ph{aspect-ratio:4/3;}
.collage.c2 .ph,.collage.c4 .ph,.collage.c5 .ph,.collage.c6 .ph{aspect-ratio:1;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s;}
.ph:hover img{transform:scale(1.06);}
.ph .cap{
  position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:.78rem;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(60,10,30,.75));line-height:1.4;
}
.empty-tip{text-align:center;color:#c08aa0;padding:60px 0;font-size:1rem;line-height:2;}
/* 灯箱 */
#lightbox{
  display:none;position:fixed;inset:0;background:rgba(30,5,15,.9);z-index:99;
  align-items:center;justify-content:center;flex-direction:column;padding:30px;
}
#lightbox.open{display:flex;}
#lightbox img{max-width:92%;max-height:78vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
#lightbox .lb-cap{color:#ffd6e3;margin-top:16px;font-size:1rem;max-width:80%;text-align:center;line-height:1.6;}
#lightbox .lb-close{position:absolute;top:22px;right:30px;font-size:2rem;color:#fff;cursor:pointer;background:none;border:none;}
/* 编辑弹窗 */
.modal-mask{
  display:none;position:fixed;inset:0;background:rgba(60,15,35,.55);z-index:50;
  align-items:center;justify-content:center;padding:20px;
}
.modal-mask.open{display:flex;}
.modal{
  background:#fff;border-radius:22px;padding:28px;width:100%;max-width:620px;
  max-height:88vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);
}
.modal h2{color:var(--deep);margin-bottom:18px;font-size:1.3rem;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:.85rem;color:#a86b85;margin-bottom:6px;}
.fld input,.fld textarea{
  width:100%;padding:10px 14px;border:1.5px solid #ffd1de;border-radius:12px;font-size:.95rem;
  font-family:inherit;background:#fffafb;color:var(--ink);outline:none;
}
.fld input:focus,.fld textarea:focus{border-color:var(--pink);}
.fld textarea{min-height:80px;resize:vertical;}
.upload-zone{
  border:2px dashed #ffb3c6;border-radius:14px;padding:26px;text-align:center;
  color:#c08aa0;cursor:pointer;transition:.2s;background:#fffafb;
}
.upload-zone:hover{border-color:var(--pink);background:var(--soft);}
.upload-zone input{display:none;}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;}
.thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#fff0f3;}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb .del{
  position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:.8rem;line-height:1;
}
.thumb .cap-edit{
  position:absolute;left:0;right:0;bottom:0;border:none;background:rgba(255,255,255,.92);
  font-size:.7rem;padding:4px 6px;outline:none;color:var(--ink);
}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;}
.btn-danger{background:#ffe0e0;color:#c0392b;}
footer{text-align:center;color:#c08aa0;font-size:.85rem;padding:30px;letter-spacing:.15em;position:relative;z-index:1;}
@media (max-width:640px){
  #timeline::before{left:14px;}
  .entry .dot{left:14px;}
  .entry .card{width:auto;margin:0 0 0 40px !important;}
  header h1{font-size:2rem;}
  .thumbs{grid-template-columns:repeat(3,1fr);}
}

</style>
</head>

<header>
  <h1>我们的三周年 <span class="heart-beat">❤</span></h1>
  <div class="sub">三 载 春 秋 · 满 是 欢 喜</div>
  <div class="days-tag" id="daysTag">💗 在一起的每一天都值得纪念</div>
</header>
<main id="timeline"></main>
<div class="empty-tip" id="emptyTip" style="display:none">✨ 还没有回忆哦</div>

  <div class="lb-cap" id="lbCap"></div>
</div>
<footer>❤ 始于心动 · 陷于温柔 · 三周年快乐 ❤</footer>

const annivDate='2023-09-27'; // ← 改成你们的纪念日
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function makeHearts(){
  const icons=['❤','💗','💖','💕','🌸'];
  for(let i=0;i<14;i++){
    const h=document.createElement('div');
    h.className='heart-bg';
    h.textContent=icons[Math.floor(Math.random()*icons.length)];
    h.style.left=Math.random()*100+'vw';
    h.style.animationDuration=(12+Math.random()*14)+'s';
    h.style.animationDelay=(-Math.random()*20)+'s';
    h.style.fontSize=(12+Math.random()*20)+'px';
    document.body.appendChild(h);
  }
}
function updateDays(){
  const start=new Date(annivDate),now=new Date();
  const days=Math.floor((now-start)/86400000);
  if(days>0)document.getElementById('daysTag').textContent=`💗 我们已经在一起 ${days} 天 · 三周年快乐`;
}
function render(){
  const tl=document.getElementById('timeline');
  tl.innerHTML='';
  const list=[...DATA].sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('emptyTip').style.display=list.length?'none':'block';
  for(const e of list){
    const div=document.createElement('div');
    div.className='entry';
    const n=e.photos.length;
    const collageClass = n<=1?'c1':n===2?'c2':n===3?'c3':n===4?'c4':n===5?'c5':n===6?'c6':'c-many';
    let photosHTML='';
    for(const p of e.photos){
      const cap=p.cap?`<div class="cap">${escapeHTML(p.cap)}</div>`:'';
      photosHTML+=`<div class="ph"><img src="${p.data}" alt="">${cap}</div>`;
    }
    div.innerHTML=`
      <div class="dot"></div>
      <div class="card">
        <span class="date">📅 ${e.date}</span>
        <h3>${escapeHTML(e.title)}</h3>
        ${e.desc?`<div class="desc">${escapeHTML(e.desc)}</div>`:''}
        ${n?`<div class="collage ${collageClass}">${photosHTML}</div>`:''}
      </div>`;
    tl.appendChild(div);
  }
  tl.querySelectorAll('.ph').forEach(ph=>{
    ph.onclick=()=>{
      document.getElementById('lbImg').src=ph.querySelector('img').src;
      const cap=ph.querySelector('.cap');
      document.getElementById('lbCap').textContent=cap?cap.textContent:'';
      document.getElementById('lightbox').classList.add('open');
    };
  });
}
makeHearts();updateDays();render();
</script>
